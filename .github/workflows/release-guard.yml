name: Release guard

# Velisa's reusable release-guard.yml (Velisa ADR-022, decision D36): the release tag's
# contract/contract.json must say the tag's version. It releases nothing.

# A tag is made either by the release job ('Release', with GITHUB_TOKEN, which starts no workflow)
# or pushed by a person: this runs when that job has finished on main, and on a pushed tag.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-guard:
    uses: kajisho5/Velisa/.github/workflows/release-guard.yml@main
